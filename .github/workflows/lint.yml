name: Helm lint
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint . --set dockerhubNamespace=example --set db.password=dummy
      - name: Render templates
        run: helm template notes . --set dockerhubNamespace=example --set db.password=dummy