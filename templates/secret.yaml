{{- if not .Values.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: notes-api-db
  labels:
    app: notes-api
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.db.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "db.password is required (or set db.existingSecret)" .Values.db.password | quote }}
{{- end }}