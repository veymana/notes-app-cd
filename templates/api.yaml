{{- $ns := required "dockerhubNamespace is required" .Values.dockerhubNamespace }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels:
    app: notes-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: notes-api
          image: "docker.io/{{ $ns }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: notes-api-config
            - secretRef:
                name: {{ .Values.db.existingSecret | default "notes-api-db" }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.api.port }}
            initialDelaySeconds: 40
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  labels:
    app: notes-api
spec:
  selector:
    app: notes-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}